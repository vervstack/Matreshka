cache_path: proto_modules

deps:
  - github.com/googleapis/googleapis
generate:
  - inputs:
      - directory: "api/grpc"
    plugins:
      - name: go
        out: internal/api/server/matreshka_api
        opts:
          paths: source_relative
      - name: go-grpc
        out: internal/api/server/matreshka_api
        opts:
          paths: source_relative
      - name: grpc-gateway
        out: internal/api/server/matreshka_api
        opts:
          paths: source_relative

      - name: openapiv2
        out: pkg/docs/swaggers

      - name: docs
        out: pkg
        opts:
          paths: source_relative
